name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Check tag matches package version
        run: |
          [ "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" ] || {
            echo "Tag $GITHUB_REF_NAME does not match package.json version" >&2
            exit 1
          }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Check dist is up to date
        run: git diff --exit-code -- dist/
      - run: npm run test:unit
      - name: Update npm (staged publishing needs npm >= 11.15)
        run: npm install -g npm@latest
      - name: Stage release for approval
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) TAG=next ;;
            *) TAG=latest ;;
          esac
          npm stage publish --access public --tag "$TAG"
